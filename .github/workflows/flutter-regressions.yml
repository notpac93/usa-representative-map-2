name: App regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  civic-data-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests

  flutter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - name: Test all app behavior and approved UI regressions
        run: flutter test --no-pub --reporter expanded
