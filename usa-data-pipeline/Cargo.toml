[package]
name = "usa-data-pipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
geo = "0.33.1"
geo-types = "0.7.19"
geojson = "1.0.0"
reqwest = { version = "0.13.4", features = ["json", "query"] }
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["full"] }
tokio-cron-scheduler = "0.13.0"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }

[dev-dependencies]
wiremock = "0.6.2"
tokio-test = "0.4.4"
